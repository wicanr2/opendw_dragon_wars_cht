name: CI

# opendw_remake 自動回歸 + 跨平台建置。
#
#   linux:   乾淨 ubuntu + SDL deps → cmake build → ctest（30 項）→ 產發佈 tarball。
#            與本機 docker dwsdl 流程一致（已在 ubuntu:24.04 容器驗證 ctest 30/30 + 打包）。
#   windows: MSVC + vcpkg(SDL2 / SDL2_ttf) → cmake build。
#   macos:   Homebrew(SDL2 / SDL2_ttf) → cmake build。
#
#   誠實標示：linux job 在本專案 docker 環境已完整驗證（build / ctest / package）。
#   windows / macos job 為「CI 設定已備」——本地 Linux 環境無法實機驗證 Win/Mac 產物，
#   待 GitHub Actions 實跑後產出對應平台 binary（見 README「跨平台」段）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Linux:完整回歸 + 打包（本專案 docker 已驗證等價流程）────────────────────
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opendw_remake
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake \
            libsdl2-dev libsdl2-ttf-dev fonts-wqy-zenhei

      - name: Configure
        run: cmake -S . -B build_ci -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_ci -j"$(nproc)"

      - name: Test (ctest)
        # smoke_app 自設 SDL_VIDEODRIVER=dummy;文字層字型走 fonts-wqy-zenhei 預設路徑。
        run: ctest --test-dir build_ci --output-on-failure

      - name: Package (tarball) + headless smoke
        # 實際產可攜包 → 解開 → 啟動器 headless --frames 0 驗證可執行（不含原始遊戲檔）。
        run: bash tools/package/build_package.sh build_pkg dist

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v4
        with:
          name: opendw-remake-linux-x86_64
          path: opendw_remake/dist/opendw-remake-*.tar.gz
          if-no-files-found: error

  # ── Windows:MSVC + vcpkg(SDL2 + SDL2_ttf)──────────────────────────────────
  #    CI 設定已備;本地 Linux 環境無法實機驗證 Windows 產物（見檔頭誠實標示）。
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: opendw_remake
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 via vcpkg
        run: |
          vcpkg install sdl2 sdl2-ttf --triplet x64-windows
        # vcpkg 預裝於 GitHub windows-latest runner;VCPKG_ROOT 環境變數已設。

      - name: Configure (MSVC + vcpkg toolchain)
        run: >
          cmake -S . -B build_ci
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build_ci --config Release -j

      # 註:Windows 下的字型走 binary 內建回退（C:/Windows/Fonts/msjh.ttc 微軟正黑），
      #     或以 DWR_FONT 指定;ctest 需 vcpkg 安裝目錄的 DLL 在 PATH 才能跑 SDL target。
      - name: Test (ctest, 非 SDL 項先行)
        continue-on-error: true
        run: ctest --test-dir build_ci -C Release --output-on-failure

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: opendw-remake-windows-x64
          path: |
            opendw_remake/build_ci/Release/opendw_remake.exe
          if-no-files-found: warn

  # ── macOS:Homebrew(SDL2 + SDL2_ttf)────────────────────────────────────────
  #    CI 設定已備;本地 Linux 環境無法實機驗證 macOS 產物（見檔頭誠實標示）。
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: opendw_remake
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 via Homebrew
        run: brew install sdl2 sdl2_ttf

      - name: Configure
        run: cmake -S . -B build_ci -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_ci -j"$(sysctl -n hw.ncpu)"

      # 註:macOS 字型走 binary 內建回退(/System/Library/Fonts/PingFang.ttc),
      #     或以 DWR_FONT 指定。headless 走 SDL_VIDEODRIVER=dummy。
      - name: Test (ctest)
        continue-on-error: true
        run: ctest --test-dir build_ci --output-on-failure

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: opendw-remake-macos
          path: opendw_remake/build_ci/opendw_remake
          if-no-files-found: warn

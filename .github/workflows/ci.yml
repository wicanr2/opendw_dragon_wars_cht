name: CI

# opendw_remake 自動回歸 + 跨平台建置。
#
#   linux:   乾淨 ubuntu + SDL deps → cmake build → ctest（37 項）→ 產發佈 tarball。
#            與本機 docker dwsdl 流程一致。
#   appimage: AppDir + appimagetool → AppImage（本機亦可 build_appimage.sh 驗）。
#   windows: MSVC + vcpkg(SDL2 / SDL2_ttf) → cmake build。本機另有 mingw 交叉編譯
#            tools/package/build_windows.sh（已 wine 實機 smoke）。
#   macos:   Homebrew(SDL2 / SDL2_ttf + dylibbundler) → 原生 build → .app bundle
#            → 原生 headless smoke（macos-13 Intel / macos-14 Apple Silicon 雙架構）。
#
#   誠實標示：linux 在本專案 docker 環境完整驗證；windows 本機 mingw + wine smoke 驗過；
#   macos 走 GitHub Actions 原生 runner（可真正執行 → headless smoke 實機驗證）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Linux:完整回歸 + 打包（本專案 docker 已驗證等價流程）────────────────────
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opendw_remake
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake \
            libsdl2-dev libsdl2-ttf-dev fonts-wqy-zenhei

      - name: Configure
        run: cmake -S . -B build_ci -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_ci -j"$(nproc)"

      - name: Test (ctest)
        # smoke_app 自設 SDL_VIDEODRIVER=dummy;文字層字型走 fonts-wqy-zenhei 預設路徑。
        run: ctest --test-dir build_ci --output-on-failure

      - name: Package (tarball) + headless smoke
        # 實際產可攜包 → 解開 → 啟動器 headless --frames 0 驗證可執行（不含原始遊戲檔）。
        run: bash tools/package/build_package.sh build_pkg dist

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v4
        with:
          name: opendw-remake-linux-x86_64
          path: opendw_remake/dist/opendw-remake-*.tar.gz
          if-no-files-found: error

  # ── AppImage:Linux 可攜「雙擊即玩」(打包 SDL2 依賴;自包含 assets,不含原始遊戲檔)──
  appimage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opendw_remake
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake \
            libsdl2-dev libsdl2-ttf-dev fonts-wqy-zenhei file libfuse2
      - name: Build AppImage
        run: bash tools/package/build_appimage.sh build_appimage dist
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: opendw-remake-linux-AppImage
          path: opendw_remake/dist/*.AppImage
          if-no-files-found: error

  # ── Windows:ubuntu 上 mingw-w64 交叉編譯(tools/package/build_windows.sh)──────────
  #    比 windows-latest 的 MSVC/vcpkg 快又穩(本機已 wine 實機 smoke 驗過同一腳本)。
  #    WIN_SMOKE=1 → CI 內裝 wine64+xvfb 跑 headless 實機 smoke(.exe 真的跑出畫面)。
  windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opendw_remake
    steps:
      - uses: actions/checkout@v4

      - name: Cross-build + package (mingw-w64) + wine smoke
        run: WIN_SMOKE=1 bash tools/package/build_windows.sh

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: opendw-remake-windows-x64
          path: opendw_remake/dist/opendw-remake-0.1.0-windows-x64.zip
          if-no-files-found: error

  # ── macOS:Homebrew(SDL2 + SDL2_ttf)────────────────────────────────────────
  #    CI 設定已備;本地 Linux 環境無法實機驗證 macOS 產物（見檔頭誠實標示）。
  # macOS 原生建置(GitHub Actions macOS runner)→ proper .app bundle + 原生 headless smoke。
  #   只建 Apple Silicon(macos-14 / arm64,涵蓋 2020 年後所有 Mac)。Intel(macos-13)
  #   因 GitHub Intel runner 供給緊、長期排不到而放棄(同碼曾在 arm64 驗證通過)。
  macos:
    name: macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: opendw_remake
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Homebrew)
        run: brew install sdl2 sdl2_ttf dylibbundler

      - name: Configure
        run: cmake -S . -B build_ci -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

      - name: Build
        run: cmake --build build_ci -j"$(sysctl -n hw.ncpu)"

      - name: Test (ctest)
        continue-on-error: true
        run: ctest --test-dir build_ci --output-on-failure

      # proper .app bundle:MacOS/binary + Frameworks/(dylibbundler 收 SDL/freetype dylib 並
      #   把 binary 的 install name 改成 @rpath)+ Resources/assets。
      - name: Build .app bundle
        run: |
          set -euo pipefail
          APPNAME=opendw-remake
          APP="dist/$APPNAME.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Frameworks" "$APP/Contents/Resources"
          cp build_ci/opendw_remake "$APP/Contents/MacOS/$APPNAME"
          cp -R assets "$APP/Contents/Resources/assets"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>火龍之戰 Dragon Wars</string>
            <key>CFBundleExecutable</key><string>opendw-remake</string>
            <key>CFBundleIdentifier</key><string>org.opendw.remake</string>
            <key>CFBundleVersion</key><string>0.1.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          # dylibbundler:把非系統 dylib(SDL2/SDL2_ttf/freetype…)收進 Frameworks 並遞迴改 @rpath。
          dylibbundler -od -b -of -x "$APP/Contents/MacOS/$APPNAME" \
            -d "$APP/Contents/Frameworks/" -p @executable_path/../Frameworks
          install_name_tool -add_rpath @executable_path/../Frameworks "$APP/Contents/MacOS/$APPNAME" 2>/dev/null || true
          echo "== otool 載入相依(應為 @rpath / 系統庫)=="; otool -L "$APP/Contents/MacOS/$APPNAME" | grep -iE "SDL2|freetype|rpath" || true

      # 原生 macOS runner 直接執行 → 真正的 runtime smoke(--frames 0 不崩 + dump 出畫面)。
      - name: Headless smoke (native macOS run)
        run: |
          set -euo pipefail
          ( cd "dist/opendw-remake.app/Contents/Resources" \
            && SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy DWR_FONT=/System/Library/Fonts/PingFang.ttc \
               ../MacOS/opendw-remake --frames 0 --dump /tmp/mac_smoke.ppm 2>&1 | grep -iE "enter map|i18n:|quest grant|paragraphs" | head -8 )
          test -f /tmp/mac_smoke.ppm && echo "✅ macOS .app 原生 headless smoke 跑出畫面(dump $(wc -c </tmp/mac_smoke.ppm) bytes)" || { echo "❌ 無 dump"; exit 1; }

      - name: Zip .app
        run: cd dist && zip -qry "opendw-remake-0.1.0-macos-${{ matrix.arch }}.zip" opendw-remake.app

      - name: Upload macOS .app
        uses: actions/upload-artifact@v4
        with:
          name: opendw-remake-macos-${{ matrix.arch }}
          path: opendw_remake/dist/opendw-remake-0.1.0-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

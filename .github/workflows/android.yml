name: Android
# P0:在 GitHub Actions 上建 Android Debug APK + x86_64 模擬器 smoke(本地無 NDK)。
#   單一 job:JDK17 + SDK/NDK/cmake → 抓 SDL2/SDL2_ttf 原始碼 → gradle assembleDebug
#            → 上傳 APK → 同 job 內開 x86_64 模擬器裝 APK → 啟動 → 截圖 + logcat。
#   合併成單 job 避免跨 job artifact 路徑問題(APK 在已知建置輸出路徑)。
on:
  push:
    branches: [main]
    paths: ['opendw_remake/android/**', 'opendw_remake/src/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['opendw_remake/android/**', 'opendw_remake/src/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      SDL_VER: 2.30.9
      TTF_VER: 2.22.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5(scaffold 無 wrapper)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Install NDK + cmake + platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" \
                     "ndk;26.3.11579264" "cmake;3.22.1" >/dev/null

      - name: Fetch SDL2 + SDL2_ttf source into app/jni
        working-directory: opendw_remake/android/app/jni
        run: |
          set -e
          curl -fsSL "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VER}/SDL2-${SDL_VER}.tar.gz" | tar xz
          mv "SDL2-${SDL_VER}" SDL
          curl -fsSL "https://github.com/libsdl-org/SDL_ttf/releases/download/release-${TTF_VER}/SDL2_ttf-${TTF_VER}.tar.gz" | tar xz
          mv "SDL2_ttf-${TTF_VER}" SDL2_ttf

      - name: Gradle assembleDebug
        working-directory: opendw_remake/android
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264

      - name: Locate APK
        id: apk
        run: |
          APK=$(find "$GITHUB_WORKSPACE/opendw_remake/android" -name '*.apk' | head -1)
          echo "found: $APK ($(du -h "$APK" | cut -f1))"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: opendw-remake-android-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # ── x86_64 模擬器 smoke:裝 APK → 啟動 → 截圖 + logcat(自動驗 P0 runtime)──
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 模擬器啟動 + 裝 APK + 截圖
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: |
            set -x
            echo "APK_PATH=[$APK_PATH]"
            adb install -r "$APK_PATH"
            adb shell am start -n cc.opendw.dragonwars/.MainActivity
            sleep 30   # 等首次解壓 assets(574 檔)+ SDL 起畫面
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/emulator-screen.png"   # 標題畫面
            adb shell input keyevent 66   # ENTER → 標題進主選單(顯示觸控按鈕)
            sleep 4
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/emulator-menu.png"     # 主選單(觸控)
            adb logcat -d > "$GITHUB_WORKSPACE/emulator-logcat.txt"
            adb shell pidof cc.opendw.dragonwars && echo "PROCESS ALIVE" || echo "PROCESS DEAD (crashed?)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-smoke
          path: |
            emulator-screen.png
            emulator-menu.png
            emulator-logcat.txt
          if-no-files-found: warn

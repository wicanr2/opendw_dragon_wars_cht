name: Android
# P0:在 GitHub Actions 上建 Android Debug APK(本地無 NDK)。
#   流程:JDK17 + Android SDK/NDK/cmake → 抓 SDL2 + SDL2_ttf 原始碼放進 app/jni/
#         → gradle assembleDebug → 上傳 APK artifact。
#   誠實標示:首版會迭代(SDL Android 整合細節),CI 紅燈屬預期,逐步收斂。
on:
  push:
    branches: [main]
    paths: ['opendw_remake/android/**', 'opendw_remake/src/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['opendw_remake/android/**', 'opendw_remake/src/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      SDL_VER: 2.30.9
      TTF_VER: 2.22.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5(scaffold 無 wrapper)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Install NDK + cmake + platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" \
                     "ndk;26.3.11579264" "cmake;3.22.1" >/dev/null

      - name: Fetch SDL2 + SDL2_ttf source into app/jni
        working-directory: opendw_remake/android/app/jni
        run: |
          set -e
          curl -fsSL "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VER}/SDL2-${SDL_VER}.tar.gz" | tar xz
          mv "SDL2-${SDL_VER}" SDL
          curl -fsSL "https://github.com/libsdl-org/SDL_ttf/releases/download/release-${TTF_VER}/SDL2_ttf-${TTF_VER}.tar.gz" | tar xz
          mv "SDL2_ttf-${TTF_VER}" SDL2_ttf
          echo "== jni 內容 =="; ls -la
          echo "== SDL java =="; ls SDL/android-project/app/src/main/java/org/libsdl/app/ | head

      - name: Gradle assembleDebug
        working-directory: opendw_remake/android
        run: |
          gradle --version || true
          gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264

      - name: Locate APK
        id: apk
        working-directory: opendw_remake/android
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "found: $APK ($(du -h "$APK" 2>/dev/null | cut -f1))"
          echo "path=opendw_remake/android/$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: opendw-remake-android-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

apply plugin: 'com.android.application'
android {
    namespace 'cc.opendw.dragonwars'
    compileSdk 34
    defaultConfig {
        applicationId 'cc.opendw.dragonwars'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-std=c++20' } }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    externalNativeBuild { cmake { path 'jni/src/CMakeLists.txt'; version '3.22.1' } }
    // 自包含 assets(bundle / fonts / i18n)打進 APK;首次啟動由 MainActivity 解壓到 internal storage。
    sourceSets { main { assets.srcDirs += ['../../assets'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
